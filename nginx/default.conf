server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Deploy topology: Traefik routes /api and /socket.io straight to the
    # backend, so this container is a pure static SPA server — it does NOT
    # proxy to the backend and therefore has no runtime dependency on it.

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
