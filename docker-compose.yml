services:
  frontend:
    build:
      context: .
      target: nginx
    container_name: trackero-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.trackero-frontend.rule=Host(`trackero.blueagate.co.in`) && !PathPrefix(`/api`) && !PathPrefix(`/socket.io`)"
      - traefik.http.routers.trackero-frontend.service=trackero-frontend-svc
      - traefik.http.services.trackero-frontend-svc.loadbalancer.server.port=80
    networks:
      - proxy

  # Requires backend/.env populated with (see .docs/specs/2026-07-25-external-services-deploy-design.md):
  #   DB:      DATABASE_HOST DATABASE_PORT DATABASE_NAME DATABASE_USERNAME DATABASE_PASSWORD DATABASE_SSL
  #            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB APP_DB_USER APP_DB_PASSWORD
  #            NOTE: POSTGRES_DB MUST equal DATABASE_NAME; APP_DB_USER/APP_DB_PASSWORD MUST equal DATABASE_USERNAME/DATABASE_PASSWORD.
  #            NOTE: if external Postgres enforces TLS, set DATABASE_SSL=true AND export PGSSLMODE=require for migrate's psql.
  #   MinIO:   MINIO_ENDPOINT MINIO_PORT MINIO_USE_SSL MINIO_ROOT_USER MINIO_ROOT_PASSWORD MINIO_BUCKET MINIO_PUBLIC_URL
  #   Origin:  APP_URL=https://trackero.blueagate.co.in (required — backs socket.io handshake + CORS), optional CORS_ORIGINS
  backend:
    build:
      context: .
      target: backend
    container_name: trackero-backend
    restart: unless-stopped
    env_file: backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # REST (/api) and websockets (/socket.io) go to the backend.
      - "traefik.http.routers.trackero-backend.rule=Host(`trackero.blueagate.co.in`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - traefik.http.routers.trackero-backend.service=trackero-backend-svc
      - traefik.http.services.trackero-backend-svc.loadbalancer.server.port=3001
    networks:
      - proxy
      - infra

  migrate:
    build:
      context: .
      target: backend
    container_name: trackero-migrate
    env_file: backend/.env
    command: ["sh", "./migrate.sh"]
    networks:
      - infra
    restart: "no"

networks:
  proxy:
    external: true
  infra:
    external: true
